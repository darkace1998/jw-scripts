name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release'
        required: true
        default: 'v0.1.0'

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        fetch-depth: 0
        # Manual runs must build the requested tag, not the default branch
        ref: ${{ github.event.inputs.tag || github.ref }}

    - name: Set up Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
      with:
        go-version: '1.25'

    - name: Cache Go modules
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: ${{ runner.os }}-go-1.25-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-1.25-

    - name: Download dependencies
      run: go mod download

    - name: Run tests
      run: go test -v ./...

    - name: Set release version
      id: version
      env:
        # Passed via the environment, never interpolated into the script,
        # so a crafted tag input cannot inject shell commands
        INPUT_TAG: ${{ github.event.inputs.tag }}
      run: |
        if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
          version="$INPUT_TAG"
        else
          version="${GITHUB_REF#refs/tags/}"
        fi
        if [[ ! "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
          echo "Invalid release version: $version" >&2
          exit 1
        fi
        echo "VERSION=$version" >> "$GITHUB_OUTPUT"

    - name: Build binaries for multiple platforms
      run: |
        mkdir -p dist
        
        # Define platforms and architectures
        platforms=(
          "linux/amd64"
          "linux/arm64"
          "windows/amd64"
          "windows/arm64"
          "darwin/amd64"
          "darwin/arm64"
        )
        
        for platform in "${platforms[@]}"; do
          IFS='/' read -r GOOS GOARCH <<< "$platform"
          
          echo "Building for $GOOS/$GOARCH..."
          
          # Set binary extension for Windows
          EXT=""
          if [[ "$GOOS" == "windows" ]]; then
            EXT=".exe"
          fi
          
          # Build each binary
          for cmd in jwb-index jwb-offline jwb-books jwb-music; do
            binary_name="${cmd}-${GOOS}-${GOARCH}${EXT}"
            
            env CGO_ENABLED=0 GOOS=$GOOS GOARCH=$GOARCH go build -trimpath \
              -ldflags="-s -w -X main.version=${{ steps.version.outputs.VERSION }}" \
              -o "dist/${binary_name}" \
              "./cmd/${cmd}"
          done
          
          # Create platform-specific archive
          archive_name="jw-scripts-${{ steps.version.outputs.VERSION }}-${GOOS}-${GOARCH}"
          
          if [[ "$GOOS" == "windows" ]]; then
            cd dist
            zip "${archive_name}.zip" *-${GOOS}-${GOARCH}.exe
            cd ..
          else
            cd dist
            tar -czf "${archive_name}.tar.gz" *-${GOOS}-${GOARCH}
            cd ..
          fi
        done
        
        # List all built files
        ls -la dist/

    - name: Generate checksums
      run: |
        cd dist
        sha256sum * > checksums.txt
        cat checksums.txt

    - name: Create Release Notes
      id: release_notes
      run: |
        cat > release_notes.md << 'EOF'
        ## JW Scripts ${{ steps.version.outputs.VERSION }}
        
        ### Downloads
        
        Choose the appropriate binary for your platform:
        
        - **Linux (x64)**: `jwb-index-linux-amd64`, `jwb-offline-linux-amd64`, `jwb-books-linux-amd64`, `jwb-music-linux-amd64`
        - **Linux (ARM64)**: `jwb-index-linux-arm64`, `jwb-offline-linux-arm64`, `jwb-books-linux-arm64`, `jwb-music-linux-arm64`
        - **Windows (x64)**: `jwb-index-windows-amd64.exe`, `jwb-offline-windows-amd64.exe`, `jwb-books-windows-amd64.exe`, `jwb-music-windows-amd64.exe`
        - **Windows (ARM64)**: `jwb-index-windows-arm64.exe`, `jwb-offline-windows-arm64.exe`, `jwb-books-windows-arm64.exe`, `jwb-music-windows-arm64.exe`
        - **macOS (Intel)**: `jwb-index-darwin-amd64`, `jwb-offline-darwin-amd64`, `jwb-books-darwin-amd64`, `jwb-music-darwin-amd64`
        - **macOS (Apple Silicon)**: `jwb-index-darwin-arm64`, `jwb-offline-darwin-arm64`, `jwb-books-darwin-arm64`, `jwb-music-darwin-arm64`
        
        Or download the complete archives:
        - Platform-specific `.tar.gz` (Linux/macOS) or `.zip` (Windows) files
        
        ### Usage
        
        After downloading, make the binaries executable (Linux/macOS):
        ```bash
        chmod +x jwb-index-* jwb-offline-* jwb-books-* jwb-music-*
        ```
        
        For help with commands:
        ```bash
        ./jwb-index --help
        ./jwb-offline --help
        ./jwb-books --help
        ./jwb-music --help
        ```
        
        ### Verification
        
        Verify downloads using the provided `checksums.txt` file:
        ```bash
        sha256sum -c checksums.txt
        ```
        EOF

    - name: Create Release
      uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
      with:
        tag_name: ${{ steps.version.outputs.VERSION }}
        name: Release ${{ steps.version.outputs.VERSION }}
        body_path: release_notes.md
        draft: false
        # Tags like v2.0.0-rc.1 are published as pre-releases
        prerelease: ${{ contains(steps.version.outputs.VERSION, '-') }}
        files: |
          dist/*
        generate_release_notes: true